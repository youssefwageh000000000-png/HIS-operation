<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تسجيل الحضور والانصراف - المستشفيات</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #eef2f3; text-align: center; padding: 20px; margin: 0; }
        .card { background: white; padding: 25px; border-radius: 12px; max-width: 420px; margin: 20px auto; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
        h2 { color: #1a252f; margin-bottom: 20px; }
        input, select, button { width: 100%; padding: 12px; margin: 8px 0; border-radius: 8px; border: 1px solid #ccc; font-size: 15px; box-sizing: border-box; }
        button { font-weight: bold; cursor: pointer; border: none; color: white; transition: 0.3s; }
        .btn-login { background: #007bff; }
        .btn-login:hover { background: #0056b3; }
        .btn-register { background: #17a2b8; }
        .btn-register:hover { background: #117a8b; }
        .btn-checkin { background: #28a745; margin-top: 12px; }
        .btn-checkout { background: #dc3545; }
        .btn-logout { background: #6c757d; margin-top: 15px; }
        .hidden { display: none; }
        #status { margin-top: 15px; font-weight: bold; line-height: 1.5; padding: 10px; border-radius: 6px; }
        .status-error { background: #f8d7da; color: #721c24; }
        .status-success { background: #d4edda; color: #155724; }
    </style>
</head>
<body>

<div class="card">
    <h2>نظام متابعة الحضور والانصراف</h2>

    <!-- قسم تسجيل الدخول وإنشاء الحساب -->
    <div id="loginSection">
        <h3>تسجيل الدخول للموظف</h3>
        <input type="email" id="loginEmail" placeholder="البريد الإلكتروني">
        <input type="password" id="loginPassword" placeholder="كلمة السر">
        <button class="btn-login" id="btnLogin">دخول</button>
        <button class="btn-register" id="btnRegister">إنشاء حساب جديد</button>
    </div>

    <!-- قسم الحضور والجيوفينسينج -->
    <div id="attendanceSection" class="hidden">
        <p style="color:#555;">مرحباً: <b id="userEmail" style="color:#007bff;"></b></p>
        
        <label style="display:block; text-align:right; margin-top:10px; font-weight:bold;">اختر المستشفى:</label>
        <select id="hospitalSelect">
            <option value="hosp1">مستشفى 1 (الرئيسي)</option>
            <option value="hosp2">مستشفى 2</option>
            <option value="hosp3">مستشفى 3</option>
            <option value="hosp4">مستشفى 4</option>
            <option value="hosp5">مستشفى 5</option>
        </select>

        <label style="display:block; text-align:right; margin-top:10px; font-weight:bold;">اختر الشيفت:</label>
        <select id="shiftSelect">
            <option value="صباحي">شيفت صباحي</option>
            <option value="مسائي">شيفت مسائي</option>
        </select>

        <button class="btn-checkin" id="btnCheckIn">تسجيل حضور 📍</button>
        <button class="btn-checkout" id="btnCheckOut">تسجيل انصراف 🚪</button>
        <button class="btn-logout" id="btnLogout">تسجيل خروج</button>
    </div>

    <div id="status"></div>
</div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
  import { getAuth, signInWithEmailAndPassword, createUserWithEmailAndPassword, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
  import { getFirestore, collection, addDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

 const firebaseConfig = {
    apiKey: "AIzaSyBNXNF_YWbr3H6DBBZPq0xITaK0wwLd2VI",
    authDomain: "hospitals-system.firebaseapp.com",
    projectId: "hospitals-system",
    storageBucket: "hospitals-system.firebasestorage.app",
    messagingSenderId: "567733040034",
    appId: "1:567733040034:web:7564c93e86f5539ebef8fb",
    measurementId: "G-FPCXJ7NTD0"
  };

  const app = initializeApp(firebaseConfig);
  const auth = getAuth(app);
  const db = getFirestore(app);

  const hospitalsLocation = {
    "hosp1": { lat: 30.0444, lng: 31.2357, name: "مستشفى 1" },
    "hosp2": { lat: 30.0500, lng: 31.2400, name: "مستشفى 2" },
    "hosp3": { lat: 30.0600, lng: 31.2500, name: "مستشفى 3" },
    "hosp4": { lat: 30.0700, lng: 31.2600, name: "مستشفى 4" },
    "hosp5": { lat: 30.0800, lng: 31.2700, name: "مستشفى 5" }
  };

  const loginSection = document.getElementById("loginSection");
  const attendanceSection = document.getElementById("attendanceSection");
  const statusDiv = document.getElementById("status");

  onAuthStateChanged(auth, (user) => {
    if (user) {
      loginSection.classList.add("hidden");
      attendanceSection.classList.remove("hidden");
      document.getElementById("userEmail").innerText = user.email;
      showStatus("", "");
    } else {
      loginSection.classList.remove("hidden");
      attendanceSection.classList.add("hidden");
    }
  });

  function showStatus(msg, type) {
    statusDiv.innerText = msg;
    statusDiv.className = "";
    if (type === 'error') statusDiv.classList.add("status-error");
    if (type === 'success') statusDiv.classList.add("status-success");
  }

  document.getElementById("btnLogin").addEventListener("click", () => {
    const email = document.getElementById("loginEmail").value;
    const pass = document.getElementById("loginPassword").value;
    if(!email || !pass) { showStatus("يرجى إدخال الإيميل والباسورد", "error"); return; }
    
    showStatus("جاري تسجيل الدخول...", "");
    signInWithEmailAndPassword(auth, email, pass)
      .catch(err => showStatus("خطأ في الدخول: " + err.message, "error"));
  });

  document.getElementById("btnRegister").addEventListener("click", () => {
    const email = document.getElementById("loginEmail").value;
    const pass = document.getElementById("loginPassword").value;
    if(!email || !pass) { showStatus("ادخل الإيميل والباسورد أولاً لإنشاء الحساب", "error"); return; }
    
    showStatus("جاري إنشاء الحساب...", "");
    createUserWithEmailAndPassword(auth, email, pass)
      .then(() => showStatus("تم إنشاء الحساب وتأكيد الدخول بنجاح!", "success"))
      .catch(err => showStatus("خطأ في إنشاء الحساب: " + err.message, "error"));
  });

  document.getElementById("btnLogout").addEventListener("click", () => signOut(auth));

  function getDistanceInMeters(lat1, lon1, lat2, lon2) {
    const R = 6371e3;
    const φ1 = lat1 * Math.PI/180;
    const φ2 = lat2 * Math.PI/180;
    const Δφ = (lat2-lat1) * Math.PI/180;
    const Δλ = (lon2-lon1) * Math.PI/180;

    const a = Math.sin(Δφ/2) * Math.sin(Δφ/2) +
              Math.cos(φ1) * Math.cos(φ2) *
              Math.sin(Δλ/2) * Math.sin(Δλ/2);
    const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
    return R * c;
  }

  function registerAttendance(type) {
    const selectedHospKey = document.getElementById("hospitalSelect").value;
    const targetHosp = hospitalsLocation[selectedHospKey];
    const shift = document.getElementById("shiftSelect").value;

    showStatus("جاري طلب الـ GPS وتأكيد الموقع...", "");

    navigator.geolocation.getCurrentPosition(
      async (position) => {
        const userLat = position.coords.latitude;
        const userLng = position.coords.longitude;

        const distance = getDistanceInMeters(userLat, userLng, targetHosp.lat, targetHosp.lng);
        const maxAllowedDistance = 200;

        if (distance > maxAllowedDistance) {
          showStatus(`❌ عذراً! أنت بعيد عن ${targetHosp.name} بمسافة (${Math.round(distance)} متر). الحد المسموح هو ${maxAllowedDistance} متر.`, "error");
          return;
        }

        try {
          await addDoc(collection(db, "attendance"), {
            employeeEmail: auth.currentUser.email,
            hospital: targetHosp.name,
            shift: shift,
            type: type,
            distanceFromHosp: Math.round(distance) + " متر",
            locationUrl: `https://maps.google.com/?q=${userLat},${userLng}`,
            timestamp: serverTimestamp()
          });

          showStatus(`✅ تم ${type} بنجاح داخل نطاق ${targetHosp.name}!`, "success");
        } catch (e) {
          showStatus("حدث خطأ في الحفظ: " + e.message, "error");
        }
      },
      (error) => {
        showStatus("⚠️ يرجى تفعيل الـ GPS في الموبايل والسماح للمتصفح بالوصول للموقع.", "error");
      },
      { enableHighAccuracy: true }
    );
  }

  document.getElementById("btnCheckIn").addEventListener("click", () => registerAttendance('تسجيل حضور'));
  document.getElementById("btnCheckOut").addEventListener("click", () => registerAttendance('تسجيل انصراف'));
</script>

</body>
</html>
